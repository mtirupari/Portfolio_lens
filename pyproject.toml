[project]
name = "portfolio-lens"
version = "0.1.0"
description = "CSV-first portfolio research and reported activity analysis"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.45,<2",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "yfinance>=0.2.65,<1",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
